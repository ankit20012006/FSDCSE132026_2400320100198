<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            width: 320px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            border: 1px solid #ddd;
        }

        .header {
            background-color: #003366; /* Dark Blue */
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #e0e0e0;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #lightblue;
            font-size: 40px;
            color: #555;
        }

        .info-container {
            padding: 0 25px;
            text-align: left;
        }

        p {
            margin: 10px 0;
            color: #333;
            font-size: 15px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 5px;
        }

        b {
            color: #003366;
            width: 80px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">Student Profile</div>
        
        <div class="profile-img">AD</div>

        <div class="info-container">
            <p><b>Name:</b> Ankit Dwivedi</p>
            <p><b>Roll No:</b> 240032011008</p>
            <p><b>Branch:</b> CSE</p>
            <p><b>College:</b> ABES Engineering College</p>
        </div>
    </div>

</body>
</html>
